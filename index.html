<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="Balancify Quest — Petualangan interaktif belajar akuntansi + Balancify Lab untuk praktik kasus apa pun." />
<meta property="og:title" content="Balancify Quest — Petualangan Siklus Akuntansi" />
<meta property="og:description" content="Belajar akuntansi dari nol lewat 5 misi interaktif, atau praktik kasus sendiri di Balancify Lab." />
<meta property="og:type" content="website" />
<meta name="theme-color" content="#6366f1" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚖️</text></svg>" />
<title>Balancify Quest — Petualangan Siklus Akuntansi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --font-head:'Outfit',sans-serif;--font-body:'Plus Jakarta Sans',sans-serif;--font-mono:'Space Grotesk',monospace;
  --bg-base:#eef2ff;--glass-bg:rgba(255,255,255,0.55);--glass-panel:rgba(255,255,255,0.78);
  --glass-border:rgba(255,255,255,0.9);--glass-shadow:0 10px 40px -10px rgba(99,102,241,0.25);--blur:blur(22px);
  --r-sm:14px;--r-md:22px;--r-lg:30px;
  --ink:#0f172a;--ink-soft:#64748b;--indigo:#6366f1;--indigo-soft:rgba(99,102,241,0.14);
  --purple:#a855f7;--cyan:#06b6d4;--pink:#ec4899;--gold:#f59e0b;--gold-soft:rgba(245,158,11,0.16);
  --green:#10b981;--green-soft:rgba(16,185,129,0.18);--rose:#ef4444;--rose-soft:rgba(239,68,68,0.16);
  --amber:#d97706;--amber-soft:rgba(217,119,6,0.16);--input-bg:rgba(255,255,255,0.7);--row-hover:rgba(99,102,241,0.06);
}
body[data-theme="profesional"]{
  --bg-base:#f1f5f9;--glass-bg:#fff;--glass-panel:#fff;--glass-border:#e2e8f0;--glass-shadow:0 2px 12px rgba(15,23,42,0.06);
  --blur:none;--r-sm:6px;--r-md:8px;--r-lg:10px;--indigo:#1e293b;--indigo-soft:#e2e8f0;--purple:#334155;
  --cyan:#0e7490;--pink:#9f1239;--gold:#b45309;--gold-soft:#fef3c7;--input-bg:#fff;--row-hover:#f8fafc;
  --font-head:'Plus Jakarta Sans',sans-serif;
}
body[data-theme="profesional"] .bg-shape,body[data-theme="profesional"] .emoji{display:none!important}
body[data-theme="profesional"] .glass{backdrop-filter:none}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100vh;overflow-x:hidden}
body{font-family:var(--font-body);color:var(--ink);background:var(--bg-base);transition:background .4s,color .3s;position:relative}
body:not([data-theme="profesional"])::before{content:'';position:fixed;inset:0;z-index:-2;pointer-events:none;
  background:radial-gradient(ellipse 60% 40% at 8% 8%,rgba(168,85,247,0.45),transparent 60%),
  radial-gradient(ellipse 55% 45% at 92% 10%,rgba(6,182,212,0.4),transparent 60%),
  radial-gradient(ellipse 60% 50% at 50% 100%,rgba(236,72,153,0.32),transparent 60%);
  animation:auroraShift 18s ease-in-out infinite alternate}
@keyframes auroraShift{0%{transform:scale(1) rotate(0)}100%{transform:scale(1.08) rotate(3deg)}}
.bg-shape{position:fixed;filter:blur(90px);opacity:.55;border-radius:50%;z-index:-1;pointer-events:none}
.bg-shape-1{width:44vw;height:44vw;background:#c4b5fd;top:-12%;left:-8%;animation:floatY 14s ease-in-out infinite alternate}
.bg-shape-2{width:40vw;height:40vw;background:#67e8f9;bottom:-14%;right:-10%;animation:floatY 16s ease-in-out infinite alternate-reverse}
@keyframes floatY{from{transform:translate(0,0)}to{transform:translate(40px,60px)}}
#root{min-height:100vh;display:flex;flex-direction:column;position:relative;z-index:1}
#confetti-canvas{position:fixed;inset:0;pointer-events:none;z-index:9000}
.mono{font-family:var(--font-mono);font-weight:700;letter-spacing:-.4px}
.watermark{position:fixed;bottom:20px;right:20px;z-index:9990;font-size:12px;font-weight:800;
  color:var(--ink-soft);background:var(--glass-panel);backdrop-filter:var(--blur);border:1px solid var(--glass-border);
  padding:8px 14px;border-radius:999px;box-shadow:var(--glass-shadow);pointer-events:none}
.theme-toggle{position:fixed;bottom:20px;left:20px;z-index:9991;padding:10px 18px;border-radius:999px;
  background:var(--glass-panel);backdrop-filter:var(--blur);border:1px solid var(--glass-border);
  font-family:var(--font-head);font-weight:800;font-size:13px;color:var(--ink);cursor:pointer;transition:.25s;
  box-shadow:var(--glass-shadow);display:flex;align-items:center;gap:6px}
.theme-toggle:hover{transform:translateY(-3px);border-color:var(--indigo);color:var(--indigo)}
.btn{font-family:var(--font-body);font-weight:800;font-size:14px;padding:11px 22px;border-radius:var(--r-sm);
  cursor:pointer;border:1px solid transparent;transition:.2s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn-primary{background:linear-gradient(135deg,var(--indigo),var(--purple));color:#fff;box-shadow:0 8px 20px -8px var(--indigo)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 12px 26px -8px var(--indigo)}
.btn-primary:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.btn-outline{background:var(--glass-panel);border-color:var(--glass-border);color:var(--ink)}
.btn-outline:hover{border-color:var(--indigo);color:var(--indigo);transform:translateY(-2px)}
.btn-ghost{background:transparent;color:var(--ink-soft)}
.btn-ghost:hover{background:var(--indigo-soft);color:var(--indigo)}
.btn-gold{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#fff;box-shadow:0 8px 20px -8px var(--gold)}
.btn-danger{background:var(--rose-soft);color:var(--rose)}
.btn-danger:hover{background:var(--rose);color:#fff}
.glass{background:var(--glass-panel);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border:1px solid var(--glass-border);border-radius:var(--r-lg);box-shadow:var(--glass-shadow)}
.loader-screen{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:var(--bg-base);gap:24px}
.loader-logo{height:80px;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.08);opacity:.85}}
.loader-bar{width:min(280px,70vw);height:8px;background:rgba(99,102,241,.15);border-radius:999px;overflow:hidden}
.loader-fill{height:100%;background:linear-gradient(90deg,var(--indigo),var(--purple),var(--cyan));border-radius:999px;animation:loadFill 2s ease-out forwards}
@keyframes loadFill{from{width:0%}to{width:100%}}
.loader-text{font-family:var(--font-head);font-weight:800;color:var(--ink-soft);font-size:14px;letter-spacing:1.2px;text-transform:uppercase}
.hero{padding:60px 24px 40px;text-align:center;max-width:1100px;margin:0 auto;width:100%}
.hero-logo{height:90px;margin-bottom:24px}
.hero h1{font-family:var(--font-head);font-size:clamp(34px,5vw,62px);font-weight:900;line-height:1.05;letter-spacing:-1.5px;margin-bottom:18px}
.hero h1 .grad{background:linear-gradient(120deg,var(--indigo),var(--purple) 45%,var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--ink-soft);font-size:clamp(15px,1.6vw,18px);max-width:640px;margin:0 auto 32px;line-height:1.6;font-weight:500}
.typing{display:inline-block;min-height:1.6em;font-weight:800;color:var(--indigo);border-right:3px solid var(--indigo);padding-right:4px;animation:caret .9s steps(2) infinite}
@keyframes caret{50%{border-color:transparent}}
.hero-stats{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:32px 0}
.hero-stat{padding:16px 22px;text-align:center;min-width:130px}
.hero-stat .v{font-family:var(--font-head);font-weight:900;font-size:26px;color:var(--indigo)}
.hero-stat .l{font-size:11px;color:var(--ink-soft);font-weight:800;text-transform:uppercase;letter-spacing:.8px;margin-top:4px}
.container{max-width:1180px;margin:0 auto;padding:20px 20px 100px;width:100%}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 22px;margin-bottom:24px;position:sticky;top:14px;z-index:20}
.topbar .brand{display:flex;align-items:center;gap:12px}
.topbar .brand img{height:34px}
.topbar .brand .name{font-family:var(--font-head);font-weight:900;font-size:18px;letter-spacing:-.5px}
.topbar-right{display:flex;align-items:center;gap:10px}
.level-pill{display:flex;align-items:center;gap:10px;padding:8px 14px;border-radius:999px;
  background:linear-gradient(135deg,var(--indigo),var(--purple));color:#fff;font-family:var(--font-head);font-weight:900;
  box-shadow:0 6px 16px -6px var(--indigo)}
.level-pill .lvl-num{font-size:18px}
.xp-wrap{display:flex;flex-direction:column;gap:6px;padding:14px 18px;border-radius:var(--r-md)}
.xp-top{display:flex;justify-content:space-between;font-size:12px;font-weight:800;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.6px}
.xp-bar{height:10px;background:rgba(99,102,241,.14);border-radius:999px;overflow:hidden}
.xp-fill{height:100%;background:linear-gradient(90deg,var(--gold),#fbbf24);transition:width .6s cubic-bezier(.4,0,.2,1);border-radius:999px}
.quest-header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:20px;flex-wrap:wrap;gap:12px}
.quest-header h2{font-family:var(--font-head);font-size:clamp(22px,2.5vw,32px);font-weight:900;letter-spacing:-.6px}
.quest-header p{color:var(--ink-soft);font-weight:600;font-size:14px;margin-top:4px}
.quest-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px;margin-bottom:40px}
.mission-card{position:relative;padding:22px;cursor:pointer;transition:.3s;display:flex;flex-direction:column;gap:14px;overflow:hidden}
.mission-card:hover{transform:translateY(-6px);border-color:var(--indigo)}
.mission-card::before{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(135deg,transparent 60%,rgba(99,102,241,.08))}
.mission-card .m-icon{font-size:40px;line-height:1}
.mission-card .m-num{position:absolute;top:16px;right:18px;font-family:var(--font-head);font-weight:900;font-size:42px;
  color:rgba(99,102,241,.12);letter-spacing:-2px}
.mission-card h3{font-family:var(--font-head);font-size:18px;font-weight:800;line-height:1.25}
.mission-card .m-desc{font-size:13px;color:var(--ink-soft);line-height:1.5;flex:1}
.mission-card .m-tag{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;padding:5px 10px;
  border-radius:999px;text-transform:uppercase;letter-spacing:.8px}
.mission-card.locked{opacity:.6;cursor:not-allowed;filter:grayscale(.4)}
.mission-card.locked:hover{transform:none;border-color:var(--glass-border)}
.mission-card.done{border-color:var(--green)}
.mission-card.done::after{content:'✓';position:absolute;bottom:18px;right:18px;width:30px;height:30px;border-radius:50%;
  background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:16px;
  box-shadow:0 6px 14px -4px var(--green)}
.mission-card.boss{border:2px solid var(--gold);background:linear-gradient(135deg,rgba(245,158,11,.06),rgba(236,72,153,.05))}
.mission-view{padding:26px}
.mission-head{display:flex;align-items:center;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.mission-head .mh-icon{font-size:44px}
.mission-head h2{font-family:var(--font-head);font-size:clamp(22px,2.6vw,30px);font-weight:900;letter-spacing:-.5px}
.mission-head .mh-sub{color:var(--ink-soft);font-size:14px;font-weight:600;margin-top:2px}
.mission-progress-steps{display:flex;gap:8px;margin:20px 0 26px;flex-wrap:wrap}
.mstep{flex:1;min-width:120px;padding:12px 14px;border-radius:var(--r-sm);background:var(--input-bg);
  border:1px solid var(--glass-border);font-size:13px;font-weight:800;color:var(--ink-soft);display:flex;align-items:center;gap:8px}
.mstep.active{background:linear-gradient(135deg,var(--indigo),var(--purple));color:#fff;border-color:transparent;
  box-shadow:0 6px 16px -6px var(--indigo)}
.mstep.done{background:var(--green-soft);color:var(--green);border-color:transparent}
.materi-content{font-size:15px;line-height:1.75;color:var(--ink)}
.materi-content h3{font-family:var(--font-head);font-size:20px;font-weight:800;margin:22px 0 10px}
.materi-content p{margin-bottom:12px}
.materi-content ul{padding-left:22px;margin-bottom:12px}
.materi-content li{margin-bottom:6px}
.materi-content .callout{padding:16px 20px;border-radius:var(--r-md);border-left:5px solid var(--indigo);
  background:var(--indigo-soft);margin:18px 0;font-size:14px}
.materi-content .callout.gold{background:var(--gold-soft);border-color:var(--gold)}
.materi-content .callout.green{background:var(--green-soft);border-color:var(--green)}
.materi-content table{width:100%;border-collapse:collapse;margin:16px 0;font-size:14px}
.materi-content th{background:var(--indigo-soft);color:var(--indigo);text-align:left;padding:10px 12px;font-size:12px;
  font-weight:800;text-transform:uppercase;letter-spacing:.5px}
.materi-content td{padding:10px 12px;border-bottom:1px solid var(--glass-border)}
.materi-content .mono{color:var(--indigo)}
.dd-wrap{display:grid;grid-template-columns:1fr 1.3fr;gap:20px}
@media(max-width:780px){.dd-wrap{grid-template-columns:1fr}}
.dd-pool{padding:18px}
.dd-pool h4,.dd-col h4{font-family:var(--font-head);font-size:13px;font-weight:800;text-transform:uppercase;
  letter-spacing:1px;color:var(--ink-soft);margin-bottom:12px}
.dd-items{display:flex;flex-direction:column;gap:10px;min-height:60px}
.dd-chip{padding:12px 14px;border-radius:var(--r-sm);background:var(--glass-panel);border:1px solid var(--glass-border);
  font-weight:700;font-size:14px;cursor:grab;display:flex;align-items:center;gap:10px;transition:.2s}
.dd-chip:hover{transform:translateX(4px);border-color:var(--indigo)}
.dd-chip.correct{background:var(--green-soft);border-color:var(--green);color:var(--green)}
.dd-chip.wrong{background:var(--rose-soft);border-color:var(--rose);color:var(--rose)}
.dd-cols{display:grid;gap:12px}
.dd-col{padding:14px;border-radius:var(--r-md);background:var(--input-bg);border:2px dashed var(--glass-border);min-height:120px;transition:.2s}
.dd-col.over{border-color:var(--indigo);background:var(--indigo-soft)}
.dd-col .zone{display:flex;flex-direction:column;gap:8px;min-height:40px}
.flash-card{padding:40px 30px;text-align:center;position:relative}
.flash-q{font-size:12px;font-weight:800;color:var(--ink-soft);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:10px}
.flash-acc{font-family:var(--font-head);font-size:clamp(24px,3vw,36px);font-weight:900;letter-spacing:-.5px;margin-bottom:6px}
.flash-cat{font-size:13px;font-weight:800;color:var(--indigo);padding:4px 12px;background:var(--indigo-soft);border-radius:999px;display:inline-block}
.flash-btns{display:flex;gap:14px;justify-content:center;margin-top:30px;flex-wrap:wrap}
.flash-btns button{padding:16px 40px;font-size:16px;font-weight:900}
.flash-progress{display:flex;justify-content:center;gap:6px;margin-top:24px}
.dot{width:10px;height:10px;border-radius:50%;background:rgba(99,102,241,.2)}
.dot.done{background:var(--green)}.dot.wrong{background:var(--rose)}.dot.now{background:var(--indigo);transform:scale(1.4)}
.sim-form{display:flex;flex-direction:column;gap:16px}
.sim-scenario{padding:18px;border-radius:var(--r-md);background:linear-gradient(135deg,var(--indigo-soft),rgba(168,85,247,.08));
  border-left:5px solid var(--indigo)}
.sim-scenario .lbl{font-size:11px;font-weight:800;color:var(--indigo);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.sim-scenario .txt{font-size:15px;font-weight:700;line-height:1.5}
.sim-row{display:grid;grid-template-columns:1fr 160px;gap:12px;align-items:center}
select,input[type=text],input[type=number],input[type=date],textarea{width:100%;padding:12px 14px;border-radius:var(--r-sm);
  border:1px solid var(--glass-border);background:var(--input-bg);font-family:var(--font-body);font-size:14px;font-weight:600;
  color:var(--ink);outline:none;transition:.2s}
select:focus,input:focus,textarea:focus{border-color:var(--indigo);box-shadow:0 0 0 3px var(--indigo-soft)}
.balance-strip{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-radius:var(--r-sm);
  background:var(--input-bg);border:1px solid var(--glass-border);font-family:var(--font-mono);font-weight:800;font-size:13px}
.balance-strip .ok{color:var(--green)}.balance-strip .no{color:var(--rose)}
.quiz-wrap{padding:26px}
.quiz-q{font-family:var(--font-head);font-size:18px;font-weight:800;line-height:1.4;margin:12px 0 18px}
.quiz-opt{display:flex;gap:12px;align-items:center;padding:14px 16px;border-radius:var(--r-sm);
  border:2px solid var(--glass-border);background:var(--input-bg);cursor:pointer;margin-bottom:10px;
  font-size:14px;font-weight:600;transition:.2s}
.quiz-opt:hover{border-color:var(--indigo);background:var(--indigo-soft)}
.quiz-opt .mark{width:26px;height:26px;border-radius:50%;background:var(--glass-panel);border:2px solid var(--glass-border);
  display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;color:var(--ink-soft);flex-shrink:0}
.quiz-opt.correct{border-color:var(--green);background:var(--green-soft)}
.quiz-opt.correct .mark{background:var(--green);border-color:var(--green);color:#fff}
.quiz-opt.wrong{border-color:var(--rose);background:var(--rose-soft)}
.quiz-opt.wrong .mark{background:var(--rose);border-color:var(--rose);color:#fff}
.quiz-opt.disabled{pointer-events:none}
.quiz-feedback{padding:14px 18px;border-radius:var(--r-md);font-size:14px;line-height:1.55;margin-top:14px}
.quiz-feedback.ok{background:var(--green-soft);border-left:5px solid var(--green)}
.quiz-feedback.no{background:var(--rose-soft);border-left:5px solid var(--rose)}
.result-panel{text-align:center;padding:40px 28px}
.result-panel h2{font-family:var(--font-head);font-size:32px;font-weight:900;letter-spacing:-.6px;margin-bottom:8px}
.result-panel .sub{color:var(--ink-soft);font-size:15px;margin-bottom:24px}
.result-xp{font-family:var(--font-head);font-size:52px;font-weight:900;
  background:linear-gradient(135deg,var(--gold),#fbbf24);-webkit-background-clip:text;background-clip:text;color:transparent}
.badge-grid{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:22px 0}
.badge-item{padding:12px 18px;border-radius:999px;background:var(--glass-panel);border:1px solid var(--glass-border);
  font-weight:800;font-size:13px;display:flex;align-items:center;gap:8px}
.badge-item.gold{background:var(--gold-soft);border-color:var(--gold);color:var(--amber)}
.sim-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:1000px){.sim-grid{grid-template-columns:1fr}}
.sim-panel{overflow:hidden}
.sim-panel .ph{padding:16px 20px;border-bottom:1px solid var(--glass-border);background:var(--glass-bg);
  display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sim-panel .ph h3{font-family:var(--font-head);font-size:16px;font-weight:800}
.sim-panel .pb{padding:18px}
.entry-block{padding:14px;border-radius:var(--r-md);background:var(--input-bg);border:1px solid var(--glass-border);margin-bottom:14px}
.entry-block .eb-title{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px}
.entry-block.debit .eb-title{color:var(--indigo)}
.entry-block.credit .eb-title{color:var(--amber)}
.entry-line{display:grid;grid-template-columns:1fr 130px 36px;gap:10px;margin-bottom:10px;align-items:center}
.icon-mini{width:36px;height:36px;border-radius:10px;border:1px solid var(--glass-border);background:var(--input-bg);

<script type="text/babel">
(() => {
const { useState, useMemo, useEffect, useRef } = React;
/* ============== UTILS ============== */
const fmt = (n) => "Rp " + Math.round(Number(n) || 0).toLocaleString("id-ID");
const uid = () => Math.random().toString(36).slice(2, 10);
function useLocalStorage(key, init) {
  const [v, setV] = useState(() => { try { const s = localStorage.getItem(key); return s ? JSON.parse(s) : init; } catch { return init; } });
  useEffect(() => { try { localStorage.setItem(key, JSON.stringify(v)); } catch {} }, [key, v]);
  return [v, setV];
}
/* ============== SOUND ============== */
let audioCtx = null;
function getCtx() { if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch {} } return audioCtx; }
function beep(freq, dur, type = 'sine', vol = 0.08, delay = 0) {
  const ctx = getCtx(); if (!ctx) return;
  const now = ctx.currentTime + delay;
  const osc = ctx.createOscillator(); const g = ctx.createGain();
  osc.type = type; osc.frequency.value = freq;
  osc.connect(g); g.connect(ctx.destination);
  g.gain.setValueAtTime(0.0001, now);
  g.gain.exponentialRampToValueAtTime(vol, now + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
  osc.start(now); osc.stop(now + dur + 0.02);
}
function playSfx(type, muted) {
  if (muted) return;
  switch(type) {
    case 'click': beep(720, 0.08, 'sine', 0.05); break;
    case 'correct': beep(523, 0.12, 'sine', 0.09); beep(659, 0.12, 'sine', 0.09, 0.10); beep(784, 0.20, 'sine', 0.09, 0.20); break;
    case 'wrong': beep(220, 0.18, 'sawtooth', 0.07); beep(160, 0.22, 'sawtooth', 0.06, 0.10); break;
    case 'drop': beep(500, 0.07, 'triangle', 0.06); break;
    case 'complete': [523,659,784,1047].forEach((f,i)=>beep(f, 0.22, 'sine', 0.09, i*0.09)); break;
    case 'unlock': beep(659, 0.14, 'sine', 0.08); beep(1047, 0.25, 'sine', 0.09, 0.14); break;
    case 'xp': beep(880, 0.06, 'square', 0.04); beep(1320, 0.10, 'square', 0.04, 0.06); break;
  }
}
/* ============== CONFETTI ============== */
function fireConfetti() {
  const c = document.getElementById('confetti-canvas'); if (!c) return;
  const ctx = c.getContext('2d');
  c.width = window.innerWidth; c.height = window.innerHeight;
  const colors = ['#6366f1','#a855f7','#06b6d4','#ec4899','#f59e0b','#10b981'];
  const parts = [];
  for (let i = 0; i < 180; i++) parts.push({ x: Math.random()*c.width, y: -20-Math.random()*c.height*0.4, vx:(Math.random()-.5)*7, vy: Math.random()*3+3, s: Math.random()*8+5, col: colors[Math.floor(Math.random()*colors.length)], rot: Math.random()*Math.PI*2, rs:(Math.random()-.5)*0.25 });
  let f = 0;
  function loop() {
    ctx.clearRect(0,0,c.width,c.height);
    parts.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += 0.14; p.rot += p.rs;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.fillStyle = p.col; ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*0.55); ctx.restore(); });
    f++; if (f < 220) requestAnimationFrame(loop); else ctx.clearRect(0,0,c.width,c.height);
  }
  loop();
}
/* ============== ACCOUNTING CORE ============== */
const CATEGORY_META = {
  ASSET:     { label: "Aset",       defaultNormal: "DEBIT",  prefix: "1" },
  LIABILITY: { label: "Liabilitas", defaultNormal: "CREDIT", prefix: "2" },
  EQUITY:    { label: "Ekuitas",    defaultNormal: "CREDIT", prefix: "3" },
  REVENUE:   { label: "Pendapatan", defaultNormal: "CREDIT", prefix: "4" },
  EXPENSE:   { label: "Beban",      defaultNormal: "DEBIT",  prefix: "5" },
};
const PRESET_ACCOUNTS = [
  { id: "1101", name: "Kas", category: "ASSET", normalBalance: "DEBIT", startingBalance: 10000000 },
  { id: "1102", name: "Sewa Dibayar Dimuka", category: "ASSET", normalBalance: "DEBIT", startingBalance: 0 },
  { id: "1103", name: "Perlengkapan", category: "ASSET", normalBalance: "DEBIT", startingBalance: 0 },
  { id: "1201", name: "Peralatan", category: "ASSET", normalBalance: "DEBIT", startingBalance: 0 },
  { id: "1202", name: "Akum. Penyusutan Peralatan", category: "ASSET", normalBalance: "CREDIT", startingBalance: 0 },
  { id: "2101", name: "Utang Usaha", category: "LIABILITY", normalBalance: "CREDIT", startingBalance: 0 },
  { id: "3101", name: "Modal Pemilik", category: "EQUITY", normalBalance: "CREDIT", startingBalance: 10000000 },
  { id: "4101", name: "Pendapatan Jasa", category: "REVENUE", normalBalance: "CREDIT", startingBalance: 0 },
  { id: "5101", name: "Beban Gaji", category: "EXPENSE", normalBalance: "DEBIT", startingBalance: 0 },
];
function nextCode(accounts, category) {
  const prefix = CATEGORY_META[category].prefix;
  const used = accounts.filter(a => a.id.startsWith(prefix)).map(a => parseInt(a.id, 10));
  const base = parseInt(prefix + "100", 10);
  return String(used.length ? Math.max(...used) + 1 : base + 1);
}
function generateExplanation(accounts, tx) {
  const parts = tx.entries.map(e => {
    const acc = accounts.find(a => a.id === e.accountId); if (!acc) return "";
    const amount = e.debit || e.credit;
    const inc = (acc.normalBalance === "DEBIT" && e.debit > 0) || (acc.normalBalance === "CREDIT" && e.credit > 0);
    return `${CATEGORY_META[acc.category].label} ${acc.name} ${inc ? "bertambah" : "berkurang"} sebesar ${fmt(amount)}`;
  });
  const td = tx.entries.reduce((s, e) => s + (e.debit || 0), 0);
  const tc = tx.entries.reduce((s, e) => s + (e.credit || 0), 0);
  const diff = td - tc;
  const closing = Math.abs(diff) < 0.01 ? "Sistem mendeteksi debit & kredit seimbang, sehingga PDA tetap terjaga." : `Namun, total debit & kredit tidak seimbang (selisih ${fmt(Math.abs(diff))}). Perbaiki agar laporan valid.`;
  return `Menganalisis "${tx.description}": ${parts.join("; sementara ")}. ${closing}`;
}
function calculateTrialBalance(accounts, transactions) {
  let td = 0, tc = 0;
  const rows = accounts.map(acc => {
    let running = acc.startingBalance || 0;
    transactions.forEach(tx => tx.entries.forEach(e => {
      if (e.accountId === acc.id) {
        if (acc.normalBalance === "DEBIT") running += (e.debit||0) - (e.credit||0);
        else running += (e.credit||0) - (e.debit||0);
      }
    }));
    let debit = acc.normalBalance === "DEBIT" ? Math.max(running, 0) : 0;
    let credit = acc.normalBalance === "CREDIT" ? Math.max(running, 0) : 0;
    if (running < 0) { if (acc.normalBalance === "DEBIT") credit = Math.abs(running); else debit = Math.abs(running); }
    td += debit; tc += credit;
    return { ...acc, debit, credit, balance: running, normal: acc.normalBalance };
  });
  return { rows, totalDebit: td, totalCredit: tc };
}
function calculateEquation(tbRows) {
  let assets = 0, liab = 0, eq = 0, rev = 0, exp = 0;
  for (const r of tbRows) {
    if (r.category === "ASSET") { if (r.normal === "CREDIT") assets -= r.balance; else assets += r.balance; }
    else if (r.category === "LIABILITY") liab += r.balance;
    else if (r.category === "EQUITY") eq += r.balance;
    else if (r.category === "REVENUE") rev += r.balance;
    else if (r.category === "EXPENSE") exp += r.balance;
  }
  const adjustedEquity = eq + (rev - exp);
  return { assets, liabilities: liab, equity: eq, revenue: rev, expenses: exp, adjustedEquity, left: assets, right: liab + adjustedEquity };
}
function calculateLedger(account, transactions) {
  let running = account.startingBalance || 0;
  const rows = [{ date: "-", desc: "Saldo Awal", debit: account.normalBalance === "DEBIT" ? running : 0, credit: account.normalBalance === "CREDIT" ? running : 0, balance: running }];
  const sorted = [...transactions].sort((a, b) => a.date.localeCompare(b.date) || a.timestamp - b.timestamp);
  sorted.forEach(tx => tx.entries.forEach(e => {
    if (e.accountId === account.id) {
      if (account.normalBalance === "DEBIT") running += (e.debit||0) - (e.credit||0);
      else running += (e.credit||0) - (e.debit||0);
      rows.push({ date: tx.date, desc: tx.description, debit: e.debit||0, credit: e.credit||0, balance: running });
    }
  }));
  rows.push({ date: "-", desc: "Saldo Akhir", balance: running, isFinal: true });
  return rows;
}
function generateDetailedPDA(accounts, transactions) {
  const activeIds = new Set();
  accounts.forEach(a => { if (a.startingBalance > 0) activeIds.add(a.id); });
  transactions.forEach(tx => tx.entries.forEach(e => { if (e.debit > 0 || e.credit > 0) activeIds.add(e.accountId); }));
  const activeAssets = accounts.filter(a => a.category === "ASSET" && activeIds.has(a.id));
  const activeLiab = accounts.filter(a => a.category === "LIABILITY" && activeIds.has(a.id));
  const rows = [];
  let runningAssets = {}; activeAssets.forEach(a => runningAssets[a.id] = a.startingBalance || 0);
  let runningLiab = {}; activeLiab.forEach(a => runningLiab[a.id] = a.startingBalance || 0);
  let runningEq = accounts.filter(a => ["EQUITY", "REVENUE", "EXPENSE"].includes(a.category))
    .reduce((s, a) => s + (a.normalBalance === "CREDIT" ? (a.startingBalance||0) : -(a.startingBalance||0)), 0);
  rows.push({ type: 'saldo', date: '-', desc: 'Saldo Awal', assets: { ...runningAssets }, liab: { ...runningLiab }, eq: runningEq, ketEq: '' });
  const sorted = [...transactions].sort((a,b) => a.date.localeCompare(b.date) || a.timestamp - b.timestamp);
  sorted.forEach(tx => {
    let eqKet = []; let rowAssets = {}; activeAssets.forEach(a => rowAssets[a.id] = 0);
    let rowLiab = {}; activeLiab.forEach(a => rowLiab[a.id] = 0); let rowEq = 0;
    tx.entries.forEach(e => {
      const acc = accounts.find(a => a.id === e.accountId); if (!acc) return;
      const val = (acc.normalBalance === "DEBIT" ? (e.debit||0) - (e.credit||0) : (e.credit||0) - (e.debit||0));
      if (acc.category === "ASSET") { rowAssets[acc.id] = val; runningAssets[acc.id] += val; }
      else if (acc.category === "LIABILITY") { rowLiab[acc.id] = val; runningLiab[acc.id] += val; }
      else { let effect = acc.category === "EXPENSE" ? -val : val; rowEq += effect; runningEq += effect; if (effect !== 0) eqKet.push(acc.name); }
    });
    rows.push({ type: 'tx', date: tx.date, desc: tx.description, assets: rowAssets, liab: rowLiab, eq: rowEq, ketEq: eqKet.join(", ") });
    rows.push({ type: 'saldo', date: '', desc: 'Saldo Berjalan', assets: { ...runningAssets }, liab: { ...runningLiab }, eq: runningEq, ketEq: '' });
  });
  return { activeAssets, activeLiab, rows };
}
/* ============== QUEST: MISSIONS DATA ============== */
const MISSIONS = [
  { id: 1, icon: "⚖️", title: "Persamaan Dasar Akuntansi", subtitle: "Aset = Liabilitas + Ekuitas", color: "#6366f1", xp: 120, desc: "Pahami pondasi akuntansi: setiap transaksi selalu menjaga keseimbangan." },
  { id: 2, icon: "↔️", title: "Saldo Normal Akun", subtitle: "Debit atau Kredit?", color: "#a855f7", xp: 120, desc: "Kuasai naluri debit/kredit untuk tiap kategori akun." },
  { id: 3, icon: "📓", title: "Jurnal Umum", subtitle: "Double-Entry Bookkeeping", color: "#06b6d4", xp: 150, desc: "Catat transaksi dengan kaidah pencatatan ganda." },
  { id: 4, icon: "📚", title: "Buku Besar & Neraca Saldo", subtitle: "Posting & Validasi", color: "#10b981", xp: 150, desc: "Telusuri aliran saldo tiap akun hingga neraca saldo." },
  { id: 5, icon: "💅", title: "Studi Kasus Salon Cantika", subtitle: "Simulasi Lengkap", color: "#ec4899", xp: 200, desc: "Jurnal 6 transaksi nyata sampai laporan seimbang." },
];
/* Mission 1 */
const M1_ITEMS = [
  { name: "Kas", cat: "ASSET" }, { name: "Piutang Usaha", cat: "ASSET" }, { name: "Peralatan", cat: "ASSET" },
  { name: "Perlengkapan", cat: "ASSET" }, { name: "Utang Usaha", cat: "LIABILITY" }, { name: "Utang Bank", cat: "LIABILITY" },
  { name: "Modal Pemilik", cat: "EQUITY" }, { name: "Prive", cat: "EQUITY" }, { name: "Pendapatan Jasa", cat: "REVENUE" },
];
function Misi1PDA({ onComplete, muted }) {
  const [pool, setPool] = useState(() => M1_ITEMS.map((x, i) => ({ ...x, id: 'm1_' + i })));
  const [cols, setCols] = useState({ ASSET: [], LIABILITY: [], EQUITY: [] });
  const [overCol, setOverCol] = useState(null);
  const [submitted, setSubmitted] = useState(false);
  const [dragItem, setDragItem] = useState(null);
  const handleDrop = (cat) => {
    if (!dragItem) return;
    setPool(pool.filter(p => p.id !== dragItem.id));
    setCols({ ...cols, [cat]: [...cols[cat], { ...dragItem, placedIn: cat }] });
    setDragItem(null); setOverCol(null); playSfx('drop', muted);
  };
  const removeFrom = (cat, id) => {
    const item = cols[cat].find(x => x.id === id);
    setCols({ ...cols, [cat]: cols[cat].filter(x => x.id !== id) });
    setPool([...pool, { ...item, placedIn: undefined }]);
  };

function MissionView({ mission, onBack, onComplete, muted }) {
  const [step, setStep] = useState(0);
  const [exerciseScore, setExerciseScore] = useState(null);
  const [quizIdx, setQuizIdx] = useState(0);
  const [picked, setPicked] = useState(null);
  const [quizScore, setQuizScore] = useState(0);
  const [finalScore, setFinalScore] = useState(null);
  const quiz = MISSION_QUIZ[mission.id] || [];
  const handleExerciseDone = (score) => { setExerciseScore(score); playSfx('xp', muted); setTimeout(() => setStep(2), 400); };
  const pickQuiz = (i) => {
    if (picked !== null) return;
    setPicked(i);
    const ok = i === quiz[quizIdx].a;
    playSfx(ok ? 'correct' : 'wrong', muted);
    if (ok) setQuizScore(quizScore + 1);
    setTimeout(() => {
      setPicked(null);
      if (quizIdx + 1 < quiz.length) setQuizIdx(quizIdx + 1);
      else {
        const fs = ok ? quizScore + 1 : quizScore;
        const total = Math.round(((exerciseScore || 0) + (fs / quiz.length) * 100) / 2);
        setFinalScore(total); playSfx('complete', muted); fireConfetti();
        onComplete(total); setStep(3);
      }
    }, 1400);
  };
  return (
    <div className="fade-in">
      <div className="glass topbar">
        <div className="brand"><button className="btn btn-ghost" onClick={onBack}>← Peta</button></div>
        <div className="topbar-right"><span style={{ fontSize: 13, fontWeight: 800, color: 'var(--ink-soft)' }}>Misi {mission.id} / 5</span></div>
      </div>
      <div className="glass mission-view">
        <div className="mission-head">
          <div className="mh-icon">{mission.icon}</div>
          <div><h2>{mission.title}</h2><div className="mh-sub">{mission.subtitle}</div></div>
        </div>
        <div className="mission-progress-steps">
          <div className={`mstep ${step === 0 ? 'active' : step > 0 ? 'done' : ''}`}><span>1.</span>📖 Materi</div>
          <div className={`mstep ${step === 1 ? 'active' : step > 1 ? 'done' : ''}`}><span>2.</span>🎮 Latihan</div>
          <div className={`mstep ${step === 2 ? 'active' : step > 2 ? 'done' : ''}`}><span>3.</span>🎯 Kuis</div>
          <div className={`mstep ${step === 3 ? 'active' : ''}`}><span>4.</span>🏆 Hasil</div>
        </div>
        {step === 0 && (<div className="fade-in"><div className="materi-content">{MATERI[mission.id]}</div><div style={{ display: 'flex', justifyContent: 'flex-end', marginTop: 24 }}><button className="btn btn-primary" onClick={() => setStep(1)}>Lanjut ke Latihan →</button></div></div>)}
        {step === 1 && (<div className="fade-in">
          {mission.id === 1 && <Misi1PDA onComplete={handleExerciseDone} muted={muted} />}
          {mission.id === 2 && <Misi2SaldoNormal onComplete={handleExerciseDone} muted={muted} />}
          {mission.id === 3 && <Misi3Jurnal onComplete={handleExerciseDone} muted={muted} />}
          {mission.id === 4 && <Misi4Ledger onComplete={handleExerciseDone} muted={muted} />}
          {mission.id === 5 && <Misi5FullSim onComplete={handleExerciseDone} muted={muted} isBoss={false} />}
        </div>)}
        {step === 2 && quiz.length > 0 && (<div className="fade-in">
          <div style={{ padding: '0 4px' }}>
            <div style={{ fontSize: 11, fontWeight: 900, color: 'var(--indigo)', textTransform: 'uppercase', letterSpacing: 1 }}>Kuis {quizIdx + 1} / {quiz.length}</div>
            <div className="quiz-q">{quiz[quizIdx].q}</div>
            {quiz[quizIdx].opts.map((o, i) => (
              <div key={i} className={`quiz-opt ${picked !== null ? 'disabled' : ''} ${picked !== null && i === quiz[quizIdx].a ? 'correct' : ''} ${picked === i && i !== quiz[quizIdx].a ? 'wrong' : ''}`} onClick={() => pickQuiz(i)}>
                <div className="mark">{String.fromCharCode(65 + i)}</div><div>{o}</div>
              </div>
            ))}
            {picked !== null && (<div className={`quiz-feedback ${picked === quiz[quizIdx].a ? 'ok' : 'no'}`}><strong>{picked === quiz[quizIdx].a ? '✓ Benar! ' : '✗ Belum tepat. '}</strong>{quiz[quizIdx].exp}</div>)}
          </div>
        </div>)}
        {step === 3 && (<div className="result-panel fade-in">
          <div style={{ fontSize: 60 }}>🎉</div>
          <h2>Misi Selesai!</h2>
          <p className="sub">Skor akhir misi ini:</p>
          <div className="result-xp">{finalScore}%</div>
          <div className="badge-grid">
            <div className="badge-item gold"><span className="emoji">⭐</span>+{mission.xp} XP</div>
            <div className="badge-item"><span className="emoji">🏅</span>{mission.title}</div>
          </div>
          <button className="btn btn-primary" onClick={onBack}>Kembali ke Peta →</button>
        </div>)}
      </div>
    </div>
  );
}

/* CSV/Excel Import Modal */
function parseCSVText(text) {
  const lines = text.split(/\r?\n/).filter(l => l.trim());
  if (lines.length < 2) return { error: 'File kosong atau hanya berisi header.' };
  const headers = lines[0].split(',').map(h => h.trim().toLowerCase().replace(/"/g, ''));
  const idx = {
    tanggal: headers.findIndex(h => h.includes('tanggal') || h.includes('date')),
    keterangan: headers.findIndex(h => h.includes('keterangan') || h.includes('desc')),
    akun: headers.findIndex(h => h === 'akun' || h.includes('akun') || h.includes('account') || h.includes('kode')),
    debit: headers.findIndex(h => h.includes('debit')),
    kredit: headers.findIndex(h => h.includes('kredit') || h.includes('credit')),
  };
  if (idx.tanggal < 0 || idx.keterangan < 0 || idx.akun < 0 || (idx.debit < 0 && idx.kredit < 0))
    return { error: 'Header tidak valid. Wajib: tanggal, keterangan, akun, debit, kredit.' };
  const rows = [];
  for (let i = 1; i < lines.length; i++) {
    const cells = lines[i].split(',').map(c => c.trim().replace(/^"|"$/g, ''));
    const date = cells[idx.tanggal]; const desc = cells[idx.keterangan]; const acc = cells[idx.akun];
    const d = Number(cells[idx.debit] || 0) || 0; const c = Number(cells[idx.kredit] || 0) || 0;
    if (!date || !desc || !acc) continue;
    rows.push({ date, desc, accountId: acc, debit: d, credit: c });
  }
  const groups = {};
  rows.forEach(r => { const key = r.date + '|' + r.desc; if (!groups[key]) groups[key] = { date: r.date, description: r.desc, entries: [] }; groups[key].entries.push({ accountId: r.accountId, debit: r.debit, credit: r.credit }); });
  const transactions = Object.values(groups).map(g => ({ id: uid(), timestamp: Date.now() + Math.random(), ...g }));
  return { transactions };
}
function downloadCSVTemplate() {
  const lines = [
    'tanggal,keterangan,akun,debit,kredit',
    '2024-03-01,Setoran modal awal,1101,20000000,',
    '2024-03-01,Setoran modal awal,3101,,20000000',
    '2024-03-05,Beli peralatan tunai,1201,5000000,',
    '2024-03-05,Beli peralatan tunai,1101,,5000000',
    '2024-03-10,Pendapatan jasa tunai,1101,3500000,',
    '2024-03-10,Pendapatan jasa tunai,4101,,3500000',
  ];
  const blob = new Blob([lines.join('\n')], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = 'template_import_balancify.csv'; a.click();
  URL.revokeObjectURL(url);
}
function ImportModal({ accounts, onImport, onClose }) {
  const [preview, setPreview] = useState(null);
  const [error, setError] = useState('');
  const fileInputRef = useRef();
  const handleFile = (file) => {
    setError(''); setPreview(null);
    const isExcel = /\.xlsx?$/i.test(file.name);
    const reader = new FileReader();
    reader.onload = (ev) => {
      let csvText = '';
      try {
        if (isExcel) {
          const wb = XLSX.read(new Uint8Array(ev.target.result), { type: 'array' });
          const ws = wb.Sheets[wb.SheetNames[0]];
          csvText = XLSX.utils.sheet_to_csv(ws);
        } else {
          csvText = ev.target.result;
        }
      } catch (e) { setError('Gagal membaca file: ' + e.message); return; }
      const res = parseCSVText(csvText);
      if (res.error) { setError(res.error); return; }
      // Validate accounts exist
      const unknown = new Set();
      res.transactions.forEach(tx => tx.entries.forEach(e => { if (!accounts.find(a => a.id === e.accountId)) unknown.add(e.accountId); }));
      if (unknown.size > 0) {
        setError(`Kode akun berikut tidak ditemukan di COA: ${[...unknown].join(', ')}. Tambahkan dulu di Setup.`);
        return;
      }
      setPreview(res.transactions);
    };
    if (isExcel) reader.readAsArrayBuffer(file); else reader.readAsText(file);
  };
  return (
    <div className="backdrop" onClick={onClose}>
      <div className="glass modal" onClick={e => e.stopPropagation()} style={{ maxWidth: 640 }}>
        <h2 style={{ fontFamily: 'var(--font-head)', marginBottom: 6 }}>📥 Import Transaksi</h2>

        <div style={{ display: 'flex', gap: 10, marginBottom: 16, flexWrap: 'wrap' }}>
          <button className="btn btn-outline" onClick={downloadCSVTemplate}><span className="emoji">📄 </span>Download Template CSV</button>
        </div>
        <div className="upload-zone" onClick={() => fileInputRef.current?.click()}>
          <input ref={fileInputRef} type="file" accept=".csv,.xlsx,.xls" style={{ display: 'none' }}
            onChange={(e) => { const f = e.target.files[0]; if (f) handleFile(f); }} />
          <div style={{ fontSize: 40, marginBottom: 8 }}>📎</div>
          <div style={{ fontWeight: 800, marginBottom: 4 }}>Klik untuk pilih file</div>
          <div style={{ fontSize: 12, color: 'var(--ink-soft)' }}>Format: .csv, .xlsx, .xls</div>
        </div>
        {error && <div className="quiz-feedback no" style={{ marginTop: 14 }}>⚠️ {error}</div>}
        {preview && (
          <div style={{ marginTop: 16 }}>
            <div className="quiz-feedback ok">✓ Terdeteksi {preview.length} transaksi. Siap di-import.</div>
            <div style={{ marginTop: 14, maxHeight: 200, overflowY: 'auto' }}>
              {preview.map((tx, i) => (
                <div key={i} className="tx-item">
                  <div className="tx-head"><span className="tx-date-pill">{tx.date}</span><span className="tx-desc">{tx.description}</span></div>
                  {tx.entries.map((e, j) => (
                    <div key={j} className="tx-entry"><span>{accounts.find(a => a.id === e.accountId)?.name || e.accountId}</span>
                      <span className={e.debit ? 'd' : 'c'}>{fmt(e.debit || e.credit)}</span>
                    </div>
                  ))}
                </div>
              ))}
            </div>
          </div>
        )}
        <div style={{ display: 'flex', gap: 10, marginTop: 20, justifyContent: 'flex-end' }}>
          <button className="btn btn-ghost" onClick={onClose}>Batal</button>
          <button className="btn btn-primary" disabled={!preview} onClick={() => { onImport(preview); onClose(); }}>Import {preview ? `(${preview.length})` : ''}</button>
        </div>
      </div>
    </div>
  );
}
/* Lab Workspace */
function LabWorkspace({ project, onExit, onSaveProject, muted }) {
  const { scenarioName, accounts: initialAccs, transactions: initialTxs } = project;
  const [accounts, setAccounts] = useState(initialAccs);
  const [transactions, setTransactions] = useState(initialTxs);
  useEffect(() => { onSaveProject({ ...project, accounts, transactions, lastModified: Date.now() }); }, [accounts, transactions]);
  const [activeTab, setActiveTab] = useState("tb");
  const [lastAction, setLastAction] = useState(null);
  const [showExport, setShowExport] = useState(false);
  const [showImport, setShowImport] = useState(false);
  const tb = useMemo(() => calculateTrialBalance(accounts, transactions), [accounts, transactions]);
  const eq = useMemo(() => calculateEquation(tb.rows), [tb.rows]);
  const isBalanced = Math.abs(tb.totalDebit - tb.totalCredit) < 0.01;
  const blankD = () => ({ id: uid(), accountId: "", amount: "" });
  const blankC = () => ({ id: uid(), accountId: "", amount: "" });
  const [date, setDate] = useState(new Date().toISOString().slice(0, 10));
  const [desc, setDesc] = useState("");
  const [debits, setDebits] = useState([blankD()]);
  const [credits, setCredits] = useState([blankC()]);
  const [showAddModalFor, setShowAddModalFor] = useState(null);
  const [ledgerAccount, setLedgerAccount] = useState(null);
  const [showPdaDrawer, setShowPdaDrawer] = useState(false);
  const tDebit = debits.reduce((s, d) => s + Number(d.amount || 0), 0);
  const tCredit = credits.reduce((s, c) => s + Number(c.amount || 0), 0);
  const diff = tDebit - tCredit;
  const canSave = desc.trim() && (tDebit > 0 || tCredit > 0);
  const handleSaveJournal = () => {
    const validDebits = debits.filter(d => d.accountId && Number(d.amount) > 0);
    const validCredits = credits.filter(c => c.accountId && Number(c.amount) > 0);
    const entries = [
      ...validDebits.map(d => ({ accountId: d.accountId, debit: Number(d.amount), credit: 0 })),
      ...validCredits.map(c => ({ accountId: c.accountId, debit: 0, credit: Number(c.amount) }))
    ];
    const tx = { id: uid(), timestamp: Date.now(), date, description: desc.trim(), entries };
    setTransactions([...transactions, tx]);
    setDesc(""); setDebits([blankD()]); setCredits([blankC()]);
    setLastAction(generateExplanation(accounts, tx));
    playSfx('correct', muted);
  };
  const renderSelect = (val, onChange, side) => (
    <select value={val} onChange={(e) => { if (e.target.value === "ADD_NEW") setShowAddModalFor(side); else onChange(e.target.value); }}>
      <option value="">Pilih Akun...</option>
      {accounts.map(a => <option key={a.id} value={a.id}>{a.id} - {a.name}</option>)}
      <option disabled>──────────</option><option value="ADD_NEW">➕ Tambah akun baru…</option>
    </select>
  );
  return (
    <div className="fade-in">
      {showAddModalFor && <AddAccountModal accounts={accounts} onClose={() => setShowAddModalFor(null)} onSave={(newAcc) => {
        setAccounts([...accounts, newAcc]);
        if (showAddModalFor === 'debit') { const i = debits.findIndex(d => !d.accountId); if (i >= 0) setDebits(debits.map((d, j) => j === i ? { ...d, accountId: newAcc.id } : d)); }
        else { const i = credits.findIndex(c => !c.accountId); if (i >= 0) setCredits(credits.map((c, j) => j === i ? { ...c, accountId: newAcc.id } : c)); }
        setShowAddModalFor(null);
      }} />}
      {ledgerAccount && <LedgerDrawer account={accounts.find(a => a.id === ledgerAccount)} transactions={transactions} onClose={() => setLedgerAccount(null)} />}
      {showPdaDrawer && <PDADetailDrawer accounts={accounts} transactions={transactions} onClose={() => setShowPdaDrawer(false)} />}
      {showExport && <ExportModal project={{ scenarioName, accounts, transactions }} onClose={() => setShowExport(false)} />}
      {showImport && <ImportModal accounts={accounts} onClose={() => setShowImport(false)} onImport={(newTxs) => { setTransactions([...transactions, ...newTxs]); fireConfetti(); }} />}
      <div className="glass topbar">
        <div className="brand">
          <button className="btn btn-ghost" onClick={onExit}>← Lab</button>
          <div className="name">{scenarioName}</div>
        </div>
        <div className="topbar-right">
          <button className="btn btn-outline" onClick={() => setShowImport(true)}><span className="emoji">📥 </span>Import</button>
          <button className="btn btn-outline" onClick={() => setShowExport(true)}><span className="emoji">📄 </span>Export PDF</button>
        </div>
      </div>
      <div className="sim-grid">
        <div>
          <div className="glass sim-panel" style={{ marginBottom: 20 }}>
            <div className="ph"><h3><span className="emoji">📝 </span>Jurnal Umum</h3></div>
            <div className="pb">
              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12, marginBottom: 16 }}>
                <div><label style={{ display: 'block', fontSize: 11, fontWeight: 800, color: 'var(--ink-soft)', textTransform: 'uppercase', marginBottom: 6 }}>Tanggal</label><input type="date" value={date} onChange={e => setDate(e.target.value)} /></div>
                <div><label style={{ display: 'block', fontSize: 11, fontWeight: 800, color: 'var(--ink-soft)', textTransform: 'uppercase', marginBottom: 6 }}>Keterangan</label><input type="text" placeholder="Cth: Pendapatan tunai" value={desc} onChange={e => setDesc(e.target.value)} /></div>
              </div>
              <div className="entry-block debit" style={{ borderColor: 'var(--indigo-soft)' }}>
                <div className="eb-title">📘 Posisi Debit</div>
                {debits.map(d => (
                  <div className="entry-line" key={d.id}>
                    {renderSelect(d.accountId, (v) => setDebits(debits.map(x => x.id === d.id ? { ...x, accountId: v } : x)), 'debit')}
                    <input type="number" placeholder="Nominal" value={d.amount} onChange={e => setDebits(debits.map(x => x.id === d.id ? { ...x, amount: e.target.value } : x))} />
                    <button className="icon-mini" onClick={() => setDebits(debits.filter(x => x.id !== d.id))} disabled={debits.length === 1}>×</button>
                  </div>
                ))}
                <button className="btn btn-ghost" style={{ fontSize: 13, width: '100%', border: '1px dashed var(--indigo)', color: 'var(--indigo)' }} onClick={() => setDebits([...debits, blankD()])}>+ Tambah Baris Debit</button>
              </div>
              <div className="entry-block credit" style={{ borderColor: 'var(--amber-soft)' }}>
                <div className="eb-title">📙 Posisi Kredit</div>
                {credits.map(c => (
                  <div className="entry-line" key={c.id}>
                    {renderSelect(c.accountId, (v) => setCredits(credits.map(x => x.id === c.id ? { ...x, accountId: v } : x)), 'credit')}
                    <input type="number" placeholder="Nominal" value={c.amount} onChange={e => setCredits(credits.map(x => x.id === c.id ? { ...x, amount: e.target.value } : x))} />
                    <button className="icon-mini" onClick={() => setCredits(credits.filter(x => x.id !== c.id))} disabled={credits.length === 1}>×</button>
                  </div>
                ))}
                <button className="btn btn-ghost" style={{ fontSize: 13, width: '100%', border: '1px dashed var(--amber)', color: 'var(--amber)' }} onClick={() => setCredits([...credits, blankC()])}>+ Tambah Baris Kredit</button>
              </div>
              <div className="balance-strip">
                <span>Debit: {fmt(tDebit)} | Kredit: {fmt(tCredit)}</span>
                <span className={diff === 0 && tDebit > 0 ? 'ok' : diff !== 0 ? 'no' : ''}>
                  {diff === 0 && tDebit > 0 ? '✅ Balance' : diff !== 0 ? `⚠️ Selisih ${fmt(Math.abs(diff))}` : ''}
                </span>
              </div>
              <button className="btn btn-primary" style={{ width: '100%', marginTop: 16, padding: 16, fontSize: 16 }} disabled={!canSave} onClick={handleSaveJournal}>Simpan Transaksi</button>
            </div>
          </div>
          <div className="glass sim-panel">
            <div className="ph"><h3><span className="emoji">🗓️ </span>Histori Transaksi</h3>
              <span style={{ fontSize: 12, color: 'var(--ink-soft)', fontWeight: 700 }}>{transactions.length} entri</span>
            </div>
            <div className="pb" style={{ maxHeight: 460, overflowY: 'auto' }}>
              {transactions.length === 0 && <div style={{ textAlign: 'center', color: 'var(--ink-soft)', padding: '40px 0' }}>Belum ada transaksi. Mulai jurnal atau import CSV/Excel.</div>}
              {[...transactions].sort((a, b) => b.date.localeCompare(a.date) || b.timestamp - a.timestamp).map(tx => (
                <div className="tx-item" key={tx.id}>
                  <div className="tx-head">
                    <div><span className="tx-date-pill">{tx.date}</span><div className="tx-desc" style={{ marginTop: 6 }}>{tx.description}</div></div>
                    <button className="icon-mini" style={{ height: 28, width: 28, fontSize: 13 }} onClick={() => { setTransactions(transactions.filter(t => t.id !== tx.id)); setLastAction(null); }}>×</button>
                  </div>
                  {tx.entries.map((e, i) => {
                    const acc = accounts.find(a => a.id === e.accountId);
                    return (<div className="tx-entry" key={i}><span>{e.debit ? '→ ' : '    ← '}{acc?.name}</span><span className={e.debit ? 'd' : 'c'}>{fmt(e.debit || e.credit)}</span></div>);
                  })}
                </div>
              ))}
            </div>
          </div>
        </div>
        <div className="glass sim-panel" style={{ alignSelf: 'start', position: 'sticky', top: 100 }}>
          <div className="ph">
            <h3><span className="emoji">📊 </span>Laporan Keuangan</h3>
            <div style={{ fontSize: 12, fontWeight: 800, color: isBalanced ? 'var(--green)' : 'var(--rose)', background: isBalanced ? 'var(--green-soft)' : 'var(--rose-soft)', padding: '6px 12px', borderRadius: 12 }}>
              {isBalanced ? '✅ BALANCE' : '⚠️ UNBALANCED'}
            </div>
          </div>
          <div className="tabs" style={{ margin: '14px 18px' }}>
            <div className={`tab ${activeTab === 'tb' ? 'active' : ''}`} onClick={() => setActiveTab('tb')}>Neraca Percobaan</div>
            <div className={`tab ${activeTab === 'pda' ? 'active' : ''}`} onClick={() => setActiveTab('pda')}>Persamaan Dasar</div>
          </div>
          <div className="pb" style={{ paddingTop: 0 }}>
            {activeTab === 'tb' && (
              <div style={{ overflowX: 'auto' }}>
                <p style={{ fontSize: 12, color: 'var(--ink-soft)', marginBottom: 16 }}>Klik nama akun untuk membuka <strong>Buku Besar</strong>.</p>
                <table className="tb-table">
                  <thead><tr><th>Kode</th><th>Nama Akun</th><th className="num">Debit</th><th className="num">Kredit</th></tr></thead>
                  <tbody>
                    {tb.rows.map(r => (
                      <tr key={r.id} className="click-row" onClick={() => setLedgerAccount(r.id)}>
                        <td className="mono" style={{ color: 'var(--ink-soft)' }}>{r.id}</td><td>{r.name}</td>
                        <td className="num mono">{r.debit ? fmt(r.debit) : '-'}</td><td className="num mono">{r.credit ? fmt(r.credit) : '-'}</td>
                      </tr>
                    ))}
                    <tr style={{ borderTop: '2px solid var(--indigo)', fontWeight: 900 }}>
                      <td colSpan="2">TOTAL</td>
                      <td className="num mono" style={{ color: 'var(--indigo)' }}>{fmt(tb.totalDebit)}</td>
                      <td className="num mono" style={{ color: 'var(--indigo)' }}>{fmt(tb.totalCredit)}</td>
                    </tr>
                  </tbody>
                </table>
              </div>
            )}
            {activeTab === 'pda' && (
              <div style={{ padding: '12px 0' }}>
                <div className="pda-eq">
                  <div className="pda-box" onClick={() => setShowPdaDrawer(true)}><div className="lbl">Total Aset</div><div className="val">{fmt(eq.assets)}</div></div>
                  <div className="pda-op">=</div>
                  <div className="pda-box" onClick={() => setShowPdaDrawer(true)}><div className="lbl">Liabilitas</div><div className="val">{fmt(eq.liabilities)}</div></div>
                  <div className="pda-op">+</div>
                  <div className="pda-box" onClick={() => setShowPdaDrawer(true)}><div className="lbl">Ekuitas (Disesuaikan)</div><div className="val">{fmt(eq.adjustedEquity)}</div></div>
                </div>
                <p style={{ textAlign: 'center', fontSize: 13, color: 'var(--ink-soft)' }}>Laba/Rugi ({fmt(eq.revenue - eq.expenses)}) telah terhitung ke ekuitas. Klik kotak untuk detail PDA.</p>
              </div>
            )}
          </div>
          {lastAction && (
            <div className="explain-box" style={{ margin: '0 18px 18px' }}>
              <div className="lbl"><span className="emoji">💡 </span>Logika Sistem</div>{lastAction}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}
/* Lab Setup Builder */
function LabBuilder({ withBalance, onStart, onBack, onHome }) {
  const [name, setName] = useState("Skenario Baru");

  const [accName, setAccName] = useState(""); const [accCat, setAccCat] = useState("ASSET");
  const [accNorm, setAccNorm] = useState("DEBIT"); const [accBal, setAccBal] = useState("");
  const handleAdd = () => {
    if (!accName.trim()) return;
    setAccounts([...accounts, { id: nextCode(accounts, accCat), name: accName, category: accCat, normalBalance: accNorm, startingBalance: withBalance ? (Number(accBal) || 0) : 0 }]);
    setAccName(""); setAccBal("");
  };
  const tb = calculateTrialBalance(accounts, []);
  const diff = tb.totalDebit - tb.totalCredit;
  const canStart = withBalance ? (accounts.length >= 2 && diff === 0) : (accounts.length >= 2);
  return (
    <div className="fade-in">
      <div className="glass topbar">
        <div className="brand"><button className="btn btn-ghost" onClick={onBack}>← Kembali</button><div className="name">Setup COA</div></div>

        <p style={{ color: 'var(--ink-soft)', marginBottom: 28 }}>{withBalance ? "Debit & kredit saldo awal wajib seimbang sebelum mulai." : "Seluruh akun berawal dari Rp0."}</p>
        <div style={{ display: 'grid', gridTemplateColumns: '1fr', gap: 16, maxWidth: 500, marginBottom: 24 }}>

            <div><label style={{ display: 'block', fontSize: 11, fontWeight: 800, color: 'var(--ink-soft)', textTransform: 'uppercase', marginBottom: 6 }}>Normal</label>
              <select value={accNorm} onChange={e => setAccNorm(e.target.value)}><option value="DEBIT">Debit</option><option value="CREDIT">Kredit</option></select>

              <div className="mono" style={{ fontWeight: 800, textAlign: 'right', fontSize: 13 }}>

            Mulai Simulasi ➔
          </button>
        </div>
      </div>
    </div>
  );
}
/* Lab Dashboard */
function LabDashboard({ onExit, onHome }) {
  const [projects, setProjects] = useLocalStorage('balancify_lab_projects', []);
  const [step, setStep] = useState('dashboard'); // dashboard | customMode | builder
  const [withBalance, setWithBalance] = useState(true);
  const [currentProject, setCurrentProject] = useState(null);
  const saveProject = (p) => {
    const np = [...projects];
    const i = np.findIndex(x => x.id === p.id);
    if (i >= 0) np[i] = p; else np.push(p);
    setProjects(np);
  };
  const deleteProject = (id) => {
    if (confirm('Hapus skenario ini secara permanen?')) setProjects(projects.filter(p => p.id !== id));
  };
  if (step === 'customMode') return (
    <div className="fade-in">
      <div className="glass topbar">
        <div className="brand"><button className="btn btn-ghost" onClick={() => setStep('dashboard')}>← Kembali</button><div className="name">Pilih Tipe Skenario</div></div>
        <div className="topbar-right"><button className="btn btn-ghost" onClick={onHome}>Home</button></div>
      </div>
      <div className="glass setup-card" style={{ margin: '0 auto', maxWidth: 800 }}>
        <h1 style={{ fontFamily: 'var(--font-head)', fontSize: 30, marginBottom: 12 }}>Neraca Saldo Awal?</h1>
        <p style={{ color: 'var(--ink-soft)', marginBottom: 32 }}>Tentukan apakah perusahaan dimulai dari kondisi keuangan berjalan, atau benar-benar entitas baru.</p>
        <div className="option-grid">
          <div className="option-card" onClick={() => { setWithBalance(true); setStep('builder'); }}>
            <h3><span className="emoji">💡 </span>Dengan Neraca Saldo Awal</h3>
            <p>Isi saldo awal akun tertentu. Sistem memastikan PDA seimbang sebelum mulai.</p>
          </div>
          <div className="option-card" onClick={() => { setWithBalance(false); setStep('builder'); }}>
            <h3><span className="emoji">🌱 </span>Mulai dari Nol</h3>
            <p>Hanya daftar akun tanpa saldo awal (semua Rp0). Cocok untuk simulasi bisnis baru.</p>
          </div>
        </div>
      </div>
    </div>
  );
  if (step === 'builder') return <LabBuilder withBalance={withBalance} onBack={() => setStep('customMode')} onHome={onHome} onStart={(p) => { saveProject(p); setCurrentProject(p); setStep('workspace'); }} />;
  if (step === 'workspace' && currentProject) return <LabWorkspace project={currentProject} onExit={() => { setStep('dashboard'); setCurrentProject(null); }} onSaveProject={saveProject} muted={false} />;
  return (
    <div className="fade-in">
      <div className="glass topbar">
        <div className="brand">
          <button className="btn btn-ghost" onClick={onHome}>← Home</button>
          <div className="name">Balancify Lab</div>
        </div>
        <div className="topbar-right">
          <span style={{ fontSize: 12, fontWeight: 800, color: 'var(--cyan)' }}>🧪 Sandbox Akuntansi</span>
        </div>
      </div>
      <div className="quest-header">
        <div><h2><span className="emoji">🧰 </span>Mode Bebas</h2><p>Susun COA, input jurnal, sampai export PDF. Multi-proyek tersimpan otomatis.</p></div>
      </div>
      <h3 style={{ fontFamily: 'var(--font-head)', fontSize: 20, marginBottom: 16 }}>🚀 Mulai Proyek Baru</h3>
      <div className="option-grid" style={{ marginBottom: 40 }}>
        <div className="option-card" onClick={() => { const p = { id: uid(), scenarioName: "Salon Cantika (Preset)", lastModified: Date.now(), accounts: PRESET_ACCOUNTS, transactions: [] }; saveProject(p); setCurrentProject(p); setStep('workspace'); }}>
          <h3><span className="emoji">💅 </span>Salon Cantika (Preset)</h3>
          <p>Kasus lengkap dengan 9 akun & modal 10jt.</p>
        </div>
        <div className="option-card" onClick={() => setStep('customMode')}>
          <h3><span className="emoji">⚙️ </span>Buat Skenario Sendiri</h3>
          <p>Susun COA dan atur studi kasus Anda dari nol. Bisa import CSV/Excel.</p>
        </div>
      </div>
      <h3 style={{ fontFamily: 'var(--font-head)', fontSize: 20, marginBottom: 8, borderTop: '1px solid var(--glass-border)', paddingTop: 32 }}><span className="emoji">📁 </span>Pekerjaan Tersimpan</h3>
      <p style={{ color: 'var(--ink-soft)', fontSize: 14 }}>Otomatis tersimpan saat Anda bekerja.</p>
      <div className="project-list">
        {projects.length === 0 && <div style={{ color: 'var(--ink-soft)', fontSize: 14, fontStyle: 'italic', marginTop: 12 }}>Belum ada pekerjaan tersimpan.</div>}
        {[...projects].sort((a, b) => b.lastModified - a.lastModified).map(p => (
          <div className="project-card" key={p.id}>
            <h3>{p.scenarioName}</h3>
            <div className="meta">
              <span>Diedit: {new Date(p.lastModified).toLocaleString('id-ID')}</span>
              <span>Transaksi: {p.transactions?.length || 0} entri</span>
            </div>
            <div style={{ display: 'flex', gap: 8, marginTop: 'auto', paddingTop: 12 }}>
              <button className="btn btn-primary" style={{ flex: 1 }} onClick={() => { setCurrentProject(p); setStep('workspace'); }}>Buka</button>
              <button className="btn btn-danger" onClick={() => deleteProject(p.id)}>Hapus</button>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}
/* ============== LOADER ============== */
function LoaderScreen() {
  return (
    <div className="loader-screen">
      <img src="logo.png" alt="Balancify" className="loader-logo" onError={(e) => { e.target.replaceWith(Object.assign(document.createElement('div'), { style: 'font-size:70px', innerText: '⚖️' })); }} />
      <div className="loader-text">Memuat Balancify…</div>
      <div className="loader-bar"><div className="loader-fill" /></div>
    </div>
  );
}
/* ============== APP ROOT ============== */
function App() {
  const [screen, setScreen] = useState('loader'); // loader | home | quest | lab
  const [theme, setTheme] = useLocalStorage('balancify_theme', 'quest');
  const [muted, setMuted] = useLocalStorage('balancify_muted', false);
  const [questState] = useLocalStorage('balancify_quest', QUEST_DEFAULT);
  useEffect(() => { document.body.setAttribute('data-theme', theme === 'profesional' ? 'profesional' : 'quest'); }, [theme]);
  useEffect(() => {
    if (screen === 'loader') { const t = setTimeout(() => setScreen('home'), 2000); return () => clearTimeout(t); }
  }, [screen]);
  return (
    <>
      {screen === 'loader' && <LoaderScreen />}
      <button className="theme-toggle" onClick={() => { setTheme(theme === 'profesional' ? 'quest' : 'profesional'); playSfx('click', muted); }}>
        {theme === 'profesional' ? '✨ Mode Quest' : '💼 Mode Profesional'}
      </button>
      <button className="theme-toggle" style={{ left: 'auto', right: 20, bottom: 20, padding: '10px 14px' }}
        onClick={() => { setMuted(!muted); playSfx('click', false); }} title="Toggle suara">
        {muted ? '🔇' : '🔊'}
      </button>
      <div className="container">
        {screen === 'home' && <HomeScreen hasProgress={questState.xp > 0} onChooseQuest={() => { playSfx('unlock', muted); setScreen('quest'); }} onChooseLab={() => { playSfx('click', muted); setScreen('lab'); }} />}
        {screen === 'quest' && <QuestApp onHome={() => setScreen('home')} muted={muted} />}
        {screen === 'lab' && <LabDashboard onHome={() => setScreen('home')} onExit={() => setScreen('home')} />}
      </div>
    </>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
})();
</script>
</body>
</html>
